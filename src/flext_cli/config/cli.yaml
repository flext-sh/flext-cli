Cli:
  name: flext-cli
  version: "0.12.0-dev"
  file_iteration:
    executable: git
    timeout_seconds: 5
    scope_files_args:
      - --literal-pathspecs
      - ls-files
      - --cached
      - --modified
      - --others
      - --exclude-standard
      - -z
    output_separator: "\0"
    fallback_excluded_segment_prefixes:
      - "."
