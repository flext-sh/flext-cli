      # Project-owned CI step (flext-9k6vf): the integration CI runs the test
      # suite on every pull request, so a red test never reaches 0.12.0-dev.
      # It reports once setup provisioned the environment, like every approval
      # verb, so a red check never hides the test verdict. Injected verbatim at
      # steps level by the flext-infra CI template — keep the six-space indent.
      - name: make tests (blocking)
        id: project-tests
        if: ${{ !cancelled() && steps.approval-setup.outcome == 'success' }}
        run: CI=Y make tests
