# Why (fleet model 0.12.0-dev, post-#1289): the project managed-artifacts
# fragment accepts only Mise and Gitignore; the per-project ruff lint
# overrides live in the linters tooling section, keyed the same way the
# codegen SSOT declares them (per-file-ignores, kebab-case).
tools:
  ruff:
    lint:
      per-file-ignores:
        src/flext_cli/_config.py: [invalid-function-name]
        src/flext_cli/_constants/base.py: [hardcoded-password-string]
        src/flext_cli/_constants/errors.py: [hardcoded-password-string]
        src/flext_cli/_utilities/formatters.py: [banned-api]
        src/flext_cli/_utilities/framework.py: [banned-api]
        src/flext_cli/_utilities/runtime.py:
          [suspicious-subprocess-import, subprocess-without-shell-equals-true]
        src/flext_cli/_utilities/processes.py:
          [suspicious-subprocess-import, subprocess-without-shell-equals-true]
